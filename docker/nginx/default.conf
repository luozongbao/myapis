# =============================================================
# MyAPIs - Nginx configuration for Docker
# -------------------------------------------------------------
# Serves:
#   /         -> web landing page (public/index.php)
#   /tools/*  -> individual tool pages (public/tools/<name>.php)
#   /api-specs/* -> API documentation (public/api-specs/<name>.php)
#   /api/*    -> REST API endpoints (api/<tool>/index.php)
# =============================================================

# Zone definitions must live in the http {} context. They define
# the per-IP connection cap and a coarse burst cap that backs the
# PHP-side sliding-window limiter. The strict per-tool budgets
# are enforced in PHP via the RateLimiter helper.
limit_conn_zone       $binary_remote_addr zone=myapis_conn:10m;
limit_req_zone        $binary_remote_addr zone=myapis_req:10m  rate=30r/s;
limit_req_status      429;
limit_conn_status     429;

server {
    listen 80 default_server;
    server_name _;

    # Allow uploads up to the value configured in docker-compose
    client_max_body_size 10M;

    # Buffer-size hardening — defends against slowloris / huge-header DoS
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    client_body_buffer_size 16k;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    # Note: HSTS is only emitted over HTTPS — see the HTTPS server
    # block further down. We do not emit it here to avoid browsers
    # locking themselves out if HTTP is ever re-enabled.

    # Hide server tokens
    server_tokens off;

    # ------------------------------------------------------------
    # Block direct access to sensitive / hidden files
    # ------------------------------------------------------------
    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~* (README\.md|RELEASE\.md|composer\.(json|lock)|\.env|api_config\.php) {
        deny all;
    }

    # Block any multi-segment PHP path under /api/ (defence in depth)
    location ~ ^/api/.+/.+\.php$ {
        deny all;
    }

    # ------------------------------------------------------------
    # Block direct access to PHP entry points other than index.php
    # under the api/ tree. /api/<tool>/index.php is the only legal
    # pattern, served by the location block below.
    # ------------------------------------------------------------
    location ~ ^/api/.+/[^/]+\.php$ {
        deny all;
    }

    # ------------------------------------------------------------
    # API endpoints - /api/<tool> (with or without trailing slash)
    # ------------------------------------------------------------
    location ~ ^/api/([^/]+)/?$ {
        # Nginx-level coarse rate limit. 30 r/s with a small burst
        # of 60 is well above the per-tool budgets enforced in PHP
        # but still defends the stack against runaway clients.
        limit_req  zone=myapis_req burst=60 nodelay;
        limit_conn myapis_conn 20;

        # Always hand the request to PHP-FPM, regardless of whether
        # the trailing slash is present.
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/api/$1/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # ------------------------------------------------------------
    # Web interfaces - everything served from /public
    # ------------------------------------------------------------
    root /var/www/html/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Pass PHP requests to PHP-FPM
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        include fastcgi_params;
    }

    # Static asset caching (images, css, js)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff2?)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
    }
}
