# =============================================================
# MyAPIs - CI Pipeline (ISSUE-004)
# -------------------------------------------------------------
# Runs on every push and pull_request targeting `dev`, `main`,
# and `feature/**`. Jobs:
#
#   1. php-lint   - php -l on every .php file under api/, public/,
#                   docker/, prompts/ and the repo root.
#   2. nginx      - syntax-check the rendered nginx template
#                   using the same sed pipeline as 00-envsubst.sh.
#   3. shell      - bash -n + shellcheck on every .sh file.
#   4. test       - placeholder that runs once ISSUE-003 (PHPUnit
#                   scaffold) lands. Currently echoes intent so
#                   the matrix passes green.
#   5. compose    - validate docker-compose.yml + the prod
#                   override file render without errors.
#   6. markdown   - basic markdown-link-check on docs/ and the
#                   top-level *.md files.
#
# All jobs run in parallel and the workflow only passes if every
# one is green. STATUS badges go in README.md (see top comment).
# =============================================================

name: CI

on:
  push:
    branches: [dev, main, 'feature/**']
  pull_request:
    branches: [dev, main]

# Cancel in-flight runs on the same branch / PR when a new commit
# arrives (saves runner minutes on rapid pushes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------
  # 1. PHP syntax check (php -l) on every .php file.
  # ------------------------------------------------------------
  php-lint:
    name: PHP lint (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint api/
        run: |
          set -e
          find api -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Lint public/
        run: |
          set -e
          find public -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Lint docker/
        run: |
          set -e
          find docker -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Lint prompts/
        run: |
          set -e
          if compgen -G "prompts/**/*.php" > /dev/null; then
            find prompts -name '*.php' -print0 | xargs -0 -n1 php -l
          else
            echo "No PHP files under prompts/ -- skipping"
          fi
      - name: Lint root *.php
        run: |
          set -e
          shopt -s nullglob
          for f in *.php; do php -l "$f"; done

  # ------------------------------------------------------------
  # 2. Nginx config syntax check.
  # Mirrors the envsubst pipeline in docker/nginx/00-envsubst.sh.
  # ------------------------------------------------------------
  nginx:
    name: Nginx config syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nginx
        run: sudo apt-get update && sudo apt-get install -y nginx-core

      - name: Render template (dry run)
        env:
          NGINX_CLIENT_MAX_BODY_SIZE: 10M
          RATE_LIMIT_PER_MINUTE: 100
        run: |
          set -e
          sed \
            -e "s|__NGINX_CLIENT_MAX_BODY_SIZE__|${NGINX_CLIENT_MAX_BODY_SIZE}|g" \
            -e "s|__RATE_LIMIT_PER_MINUTE__|${RATE_LIMIT_PER_MINUTE}|g" \
            docker/nginx/default.conf.template > /tmp/default.conf
          cat /tmp/default.conf

      - name: nginx -t
        run: |
          set -e
          sudo cp /tmp/default.conf /etc/nginx/conf.d/default.conf
          sudo nginx -t

  # ------------------------------------------------------------
  # 3. Shell script sanity (bash -n + shellcheck if available).
  # ------------------------------------------------------------
  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n on every .sh
        run: |
          set -e
          find . -name '*.sh' -not -path './node_modules/*' -print0 \
            | xargs -0 -I{} bash -n {}

      - name: shellcheck (best-effort)
        run: |
          set +e
          if command -v shellcheck >/dev/null 2>&1; then
            find . -name '*.sh' -not -path './node_modules/*' -print0 \
              | xargs -0 -n1 shellcheck
          else
            echo "shellcheck not installed -- skipping (bash -n already passed)"
          fi

  # ------------------------------------------------------------
  # 4. Test placeholder -- replace with PHPUnit once ISSUE-003
  # (test scaffold) is merged. Currently a no-op smoke test.
  # ------------------------------------------------------------
  test:
    name: Test placeholder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke check
        run: |
          echo "Test placeholder -- PHPUnit scaffold lands with ISSUE-003."
          echo "Verify public/ and api/ have at least one PHP entrypoint:"
          test -f public/index.php || (echo "public/index.php missing" && exit 1)
          test -d api       || (echo "api/ directory missing"   && exit 1)
          echo "OK"

  # ------------------------------------------------------------
  # 5. Compose validation -- both dev and prod override files.
  # ------------------------------------------------------------
  compose:
    name: Docker Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Use the official docker/setup-compose action so we always
      # match the version developers have locally.
      - name: Setup Compose
        uses: docker/setup-compose-action@v4

      - name: Validate dev stack
        run: cp example.env .env && docker compose config --quiet

      - name: Validate dev+prod stack
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

  # ------------------------------------------------------------
  # 6. Markdown link check (lightweight, --offline mode).
  # ------------------------------------------------------------
  markdown:
    name: Markdown link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: lychee (offline)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --exclude '^https://web\.local' 'docs/**/*.md' 'README.md' 'RELEASE.md'
        env:
          LYCHEE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
